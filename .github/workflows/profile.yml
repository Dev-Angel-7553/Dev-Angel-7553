name: Expressive Profile

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - profile.json
      - .profile/icons.json

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GIT_AUTHOR_NAME: Dev-Angel-7553
      GIT_AUTHOR_EMAIL: 265250071+Dev-Angel-7553@users.noreply.github.com
      GIT_COMMITTER_NAME: Dev-Angel-7553
      GIT_COMMITTER_EMAIL: 265250071+Dev-Angel-7553@users.noreply.github.com
    steps:
      - uses: actions/checkout@v4
      - uses: metawka/expressive-profile@v1
        with:
          token: ${{ secrets.PROFILE_TOKEN || github.token }}
