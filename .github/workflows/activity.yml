# Rebuilds assets/activity.svg (dot-matrix activity card) once a day.
name: activity

on:
  schedule:
    - cron: "17 21 * * *"   # 00:17 по Москве
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/activity.py
      - .github/workflows/activity.yml

permissions:
  contents: write

concurrency:
  group: activity
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python3 scripts/activity.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- assets/activity.svg && git ls-files --error-unmatch assets/activity.svg >/dev/null 2>&1; then
            echo "no changes"; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity.svg
          git commit -m "activity: обновление карточки"
          git pull --rebase origin main
          git push origin HEAD:main
